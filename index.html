<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook - v1</title>
    <style>
        :root {
            --primary: #0f62fe;
            --primary-hover: #0353e9;
            --bg-color: #f4f7fb;
            --card-bg: #ffffff;
            --text-main: #161616;
            --text-secondary: #525252;
            --border-color: #e0e0e0;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        .header-card {
            background: linear-gradient(135deg, #0f62fe, #002d9c);
            color: #ffffff;
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .form-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        .entries-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .entries-header h2 {
            font-size: 1.3rem;
            color: var(--text-main);
        }

        .badge {
            background-color: #e0e0e0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-weight: 600;
        }

        .entries-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .entry-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.3s ease-in-out;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .entry-author {
            font-weight: 700;
            color: var(--primary);
        }

        .entry-date {
            color: var(--text-secondary);
        }

        .entry-text {
            color: var(--text-main);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-secondary);
            background-color: var(--card-bg);
            border-radius: var(--radius);
            border: 1px dashed var(--border-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-card">
            <h1>Guestbook - v1</h1>
            <p class="subtitle">Cloud Native Kubernetes Guestbook Application</p>
        </header>

        <main>
            <section class="form-card">
                <form id="guestbookForm">
                    <div class="form-group">
                        <label for="authorInput">Your Name</label>
                        <input type="text" id="authorInput" name="author" placeholder="Enter your name" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="messageInput">Your Message</label>
                        <textarea id="messageInput" name="message" placeholder="Write a message for the guestbook..." required></textarea>
                    </div>
                    <button type="submit" id="submitBtn">Sign Guestbook</button>
                </form>
            </section>

            <section>
                <div class="entries-header">
                    <h2>Guestbook Entries</h2>
                    <span class="badge" id="entryCount">0 entries</span>
                </div>
                <ul class="entries-list" id="entriesList">
                    <li class="empty-state" id="emptyState">No entries yet. Be the first to leave a message!</li>
                </ul>
            </section>
        </main>

        <footer>
            <p>IBM Cloud & Kubernetes Skills Network Lab &bull; Release v1.0</p>
        </footer>
    </div>

    <script>
        const form = document.getElementById('guestbookForm');
        const authorInput = document.getElementById('authorInput');
        const messageInput = document.getElementById('messageInput');
        const entriesList = document.getElementById('entriesList');
        const emptyState = document.getElementById('emptyState');
        const entryCount = document.getElementById('entryCount');

        const initialEntries = [
            {
                author: "Kubernetes Admin",
                message: "Welcome to the Guestbook v1 application running on Kubernetes!",
                timestamp: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' })
            }
        ];

        let entries = [];
        try {
            const saved = localStorage.getItem('guestbook_v1_entries');
            entries = saved ? JSON.parse(saved) : initialEntries;
        } catch (e) {
            entries = initialEntries;
        }

        function renderEntries() {
            entryCount.textContent = `${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`;
            if (entries.length === 0) {
                entriesList.innerHTML = '<li class="empty-state">No entries yet. Be the first to leave a message!</li>';
                return;
            }

            entriesList.innerHTML = entries.map(entry => `
                <li class="entry-item">
                    <div class="entry-header">
                        <span class="entry-author">${escapeHtml(entry.author)}</span>
                        <span class="entry-date">${escapeHtml(entry.timestamp)}</span>
                    </div>
                    <p class="entry-text">${escapeHtml(entry.message)}</p>
                </li>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const author = authorInput.value.trim();
            const message = messageInput.value.trim();

            if (!author || !message) return;

            const newEntry = {
                author: author,
                message: message,
                timestamp: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            entries.unshift(newEntry);
            try {
                localStorage.setItem('guestbook_v1_entries', JSON.stringify(entries));
            } catch (err) {}

            authorInput.value = '';
            messageInput.value = '';
            renderEntries();
        });

        renderEntries();
    </script>
</body>
</html>
