<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guestbook - v2</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f7fb;
      color: #161616;
      margin: 0;
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e0e0;
    }
    .badge {
      display: inline-block;
      background-color: #0043ce;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    h1 {
      color: #0043ce;
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.85rem;
    }
    p {
      color: #525252;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #393939;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #8d8d8d;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #0043ce;
      box-shadow: 0 0 0 3px rgba(0, 67, 206, 0.2);
    }
    button {
      margin-top: 1.25rem;
      width: 100%;
      background: #0043ce;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #002d9c;
    }
    .messages-section {
      margin-top: 2rem;
      border-top: 1px solid #e0e0e0;
      padding-top: 1rem;
    }
    h2 {
      font-size: 1.15rem;
      color: #161616;
      margin-bottom: 0.75rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 0.6rem 0.8rem;
      background: #edf5ff;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Updated Release</span>
    <h1>Guestbook - v2</h1>
    <p>Cloud Native Kubernetes Guestbook Application running on IBM Cloud with Rolling Updates.</p>

    <form id="guestbook-form" onsubmit="addEntry(event)">
      <label for="message">Enter your message:</label>
      <input type="text" id="message" name="message" placeholder="Write a message for the guestbook (v2)..." required>
      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <div class="messages-section">
      <h2>Guestbook Messages</h2>
      <ul id="entries">
        <li>Welcome to Guestbook v2 on Kubernetes!</li>
      </ul>
    </div>
  </div>

  <script>
    function addEntry(e) {
      e.preventDefault();
      const input = document.getElementById('message');
      const text = input.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.textContent = text;
      document.getElementById('entries').appendChild(li);
      input.value = '';
    }
  </script>
</body>
</html>
