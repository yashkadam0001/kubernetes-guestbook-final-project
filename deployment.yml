apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
  labels:
    app: guestbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
      - name: guestbook
        # Image reference using IBM Cloud Container Registry namespace:
        # Replace <sn-labs-namespace> with your actual lab namespace (e.g., $MY_NAMESPACE)
        image: us.icr.io/<sn-labs-namespace>/guestbook:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: 2m
          limits:
            cpu: 5m
